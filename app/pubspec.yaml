name: uhribe
description: "uHribe — beleženje obiskanih slovenskih vrhov."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  mapbox_maps_flutter: ^2.31.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.3.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  uuid: ^4.6.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  min_sdk_android: 23
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F7F5F0"
  image: "assets/icon/splash_icon.png"
  color_dark: "#12241B"
  image_dark: "assets/icon/splash_icon_dark.png"
  android_12:
    color: "#F7F5F0"
    image: "assets/icon/splash_icon.png"
    color_dark: "#12241B"
    image_dark: "assets/icon/splash_icon_dark.png"
  android: true
  ios: true
  web: false

flutter:

  uses-material-design: true

  assets:
    # Read by flutter_dotenv at startup. Everything under assets/icon/ is
    # consumed from disk by flutter_launcher_icons and flutter_native_splash
    # at generation time, so it is deliberately not bundled here.
    - .env

  shaders:
    - shaders/liquid_glass.frag

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
